# %s = the out-of-bounds qubit index used, %s = the Program's declared qubit count,
# %s = the highest valid index (declared count - 1).
program.qubit.outofbounds=Qubit index %s is out of bounds: this Program declares %s qubits, so valid indices are 0..%s.

# %s = the qubit index used by more than one gate in the same step.
program.qubit.collision=Qubit index %s is used by more than one gate in the same step.
